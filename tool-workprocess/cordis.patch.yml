# tool-workprocess 的装载层（bundle patch）。
#
# 一包一 patch（对齐宿主：每个 `@deepseek-ai/*` 包自带自己的装载行）：本文件只插自己那一行。
# 目标 profile 的 `dsh.profile.bundles` 里列了本包 ⇒ 这一行才会被应用；
# **`dsh.bundle.patch` 指向的文件读不到，宿主会整个跳过这个 bundle**（现象：重启也不见本包生效）。
- insert:
    - id: tool-workprocess
      name: "tool-workprocess"
      config:
        # 自治回合落 block 的前置轮数（缺省 3，对齐宿主 goal 的 blockedAfterConsecutiveRounds）。
        blockedAfterRounds: 3
        # 浏览器只读数据面额外允许的 Host（缺省空 = 只认 loopback：localhost / 127.0.0.1 / ::1）。
        # 从局域网地址 / 隧道域名 / 反代域名打开界面时，把该主机名（可带端口）列进来；
        # `'*'` = 全放行（自己清楚暴露面时用）。放行 Host 不等于放行跨源（Origin 仍须同源）。
        # apiHosts: ["mybox.lan:8080"]
