# workprocess 的装载层（bundle patch）。
#
# 一包一 patch（对齐宿主：每个 `@deepseek-ai/*` 包自带自己的装载行）：本文件只插领域插件那一行。
# 工具面 / 回合驱动器 / 命令行各自带自己的 patch——**四条包各自独立可装可卸**，
# 顺序由 cordis 的 `inject` 保证（消费方等提供方）。
#
# 为什么必须有这个文件：目标 profile 的 `dsh.profile.bundles` 里列了本包，而本包 package.json
# 声明了 `dsh.bundle.patch: ./cordis.patch.yml` —— DSH 加载器**读不到**该文件时会**整个跳过**
# 这个 bundle（现象：重启宿主也看不到任何 workprocess 工具）。
- insert:
    - id: workprocess
      name: "workprocess"
    # 不变量伴生件（对齐宿主 `dsh-goal/invariant`）：**只在开发/CI** 挂——它 inject `invariants`，
    # 而桌面 profile 不挂 `@deepseek-ai/dsh-invariants`（那个服务在发行物里**没有 provider**，
    # 宿主自己的 goal/session 伴生件同样因此休眠）。要用就放开下面两行，
    # 并在 profile 里补一挂 `@deepseek-ai/dsh-invariants` 的行：
    # - id: workprocess-invariant
    #   name: "workprocess/invariant"
